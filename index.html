<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Calculadora de Produtividade</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
   <header>
     <div>
        <a href="login.html">
            <img class="imgtopo" src="imagens/logo 3.png">
        </a>
     </div>
    
        </header>
     
     <section id="primeira seção">
         <div class="container">
           <select id="produto" onchange="atualizarEmbalagens()">
             <option value="refrigerante">Refrigernate</option>
             <option value="cerveja">Cerveja</option>  
           </select>
           
           <div class="sei">
            <label for="tipoEmbalagem">Tipo de embalagem</label>
           <input type="text" list="embalagem" id="tipoEmbalagem" placeholder="Tipo de embalagem" class="texto">
           </div>
           <datalist id="embalagem">
               <option value="Lata"> </option>
               <option value="Garrafa PET"> </option>
               <option value="Garrafa De Vidro"> </option>
               <option value="Barril"> </option>
            </datalist>
            

            <div class="sei">
             <label for="quantidade">Quantidade</label>
             <input type="number" id="quantidade" placeholder="Quantidade" class="texto">
                </div>

                <div class="sei">
             <label for="velocidade">Velocidade(min)</label>
             <input type="number" id="velocidade" placeholder="Velocidade(min)" class="texto">
             <input type="button" placeholder="Calcular" value="Calcular" class="btn" onclick="redirecionar()">
                     </div>
                     </div>
       
          
             <table>
             <tr>
                <th>Tipo de embalagem</th>
                <th>Preço</th>       
             </tr>
             <tr>
                 <td id="tipoEmbalagemResultado">-</td>
                 <td id="precoResultado">-</td>
             </tr>
     
     
             <tr>
             <th>Velocidade(min)</th>
             </tr>
             <tr>
                 <td id="velocidadeResultado">-</td>
             </tr>
     
     
             <tr>
                 <th>Quantidade</th>
             </tr>
     
              <tr> 
                 <td id="quantidadeResultado">-</td>
             </tr>
     
             <tr>
                 <th>Perda % por produto produzido</th>
             </tr>
     
             <tr>
                 <td id="perdaResultado">-</td>
             </tr>
     
             <tr>
                 <th>Total</th>
             </tr>
     
             <tr>
                 <td id="totalComPerdaResultado">-</td>
     
         </table>
         
     
     </div>
     
     </section>
     
     <section id="segunda seção">
         
         
     <script src="main.js"></script>
     </body>
     </html>
